---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: helmreleases
  namespace: benchmark
  labels:
    app.kubernetes.io/component: benchmark
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 12h
    fluxcd.controlplane.io/reconcileTimeout: 20m
    fluxcd.controlplane.io/reconcile: enabled
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: sources
      namespace: benchmark
      ready: true
      readyExpr: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app.kubernetes.io/component: benchmark
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  resourcesTemplate: |
    <<- range $i := until (int inputs.objects) >>
    <<- $id := add $i 1 >>
    <<- $name := printf "hrapp-%04d" $id >>
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: << $name >>
      namespace: << inputs.provider.namespace >>
    data:
      values.yaml: |
        ui:
          color: "<< inputs.ui.color >>"
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: << $name >>
      namespace: << inputs.provider.namespace >>
    spec:
      interval: << inputs.interval | quote >>
      serviceAccountName: flux-operator
      chartRef:
        kind: OCIRepository
        name: << if lt $i 50 >>hrapp-chart-canary<< else >>hrapp-chart<< end >>
      driftDetection:
        mode: enabled
      values:
        replicaCount: << inputs.replicaCount | int >>
        serviceAccount:
          enabled: true
        ui:
          message: "<< inputs.ui.message >>"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: app.fluxcd.io/role
                      operator: In
                      values:
                        - benchmark
        tolerations:
          - effect: NoSchedule
            key: app.fluxcd.io/role
            operator: Equal
            value: benchmark
      valuesFrom:
      - kind: ConfigMap
        name: << $name >>
    <<- end >>
