---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: helmreleases
  namespace: benchmark
  labels:
    app.kubernetes.io/component: benchmark
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
    fluxcd.controlplane.io/reconcileTimeout: 10m
    fluxcd.controlplane.io/reconcile: enabled
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app.kubernetes.io/component: benchmark
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  resourcesTemplate: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: hrapp-chart
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: 6.x
    <<- range $i := until (int inputs.objects) >>
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: hrapp-values-<< add $i 1 >>
      namespace: << inputs.provider.namespace >>
    data:
      values.yaml: |
        ui:
          color: "<< inputs.ui.color >>"
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: hrapp-<< add $i 1 >>
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 5m
      serviceAccountName: flux-operator
      chartRef:
        kind: OCIRepository
        name: hrapp-chart
      driftDetection:
        mode: enabled
      values:
        replicaCount: 0
        ui:
          message: "<< inputs.ui.message >>"
      valuesFrom:
      - kind: ConfigMap
        name: hrapp-values-<< add $i 1 >>
    <<- end >>
