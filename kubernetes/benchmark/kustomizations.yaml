---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kustomizations
  namespace: benchmark
  labels:
    app.kubernetes.io/component: benchmark
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
    fluxcd.controlplane.io/reconcileTimeout: 10m
    fluxcd.controlplane.io/reconcile: enabled
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app.kubernetes.io/component: benchmark
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  resourcesTemplate: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: ksapp-manifests
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/manifests/podinfo
      ref:
        tag: latest
    <<- range $i := until (int inputs.objects) >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: ksapp-<< add $i 1 >>
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 15m
      wait: true
      targetNamespace: << inputs.provider.namespace >>
      serviceAccountName: flux-operator
      retryInterval: 5m
      timeout: 3m
      prune: true
      namePrefix: ksapp-<< add $i 1 >>-
      path: ./
      sourceRef:
        kind: OCIRepository
        name: ksapp-manifests
      patches:
        - target:
            kind: Service
          patch: |-
            - op: replace
              path: /spec/selector/app
              value: ksapp-<< add $i 1 >>-podinfo
        - target:
            kind: Deployment
          patch: |-
            - op: replace
              path: /spec/selector/matchLabels/app
              value: ksapp-<< add $i 1 >>-podinfo
            - op: replace
              path: /spec/template/metadata/labels/app
              value: ksapp-<< add $i 1 >>-podinfo
            - op: add
              path: /spec/replicas
              value: 0
            - op: add
              path: /spec/template/spec/containers/0/env/-
              value:
                name: PODINFO_UI_MESSAGE
                value: "<< inputs.ui.message >>"
    <<- end >>
