---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: input-sources
  namespace: benchmark
  labels:
    app.kubernetes.io/component: sources
spec:
  type: Static
  defaultValues:
    version: 6.9.0
    canaryVersion: 6.9.0
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: sources
  namespace: benchmark
  labels:
    app.kubernetes.io/component: benchmark
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 12h
    fluxcd.controlplane.io/reconcileTimeout: 5m
    fluxcd.controlplane.io/reconcile: enabled
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app.kubernetes.io/component: sources
  commonMetadata:
    labels:
      sharding.fluxcd.io/key: apps
  resourcesTemplate: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: ksapp-manifests
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/manifests/podinfo
      ref:
        semver: "<< inputs.version >>"
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: ksapp-manifests-canary
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/manifests/podinfo
      ref:
        semver: "<< inputs.canaryVersion >>"
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: hrapp-chart
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: << inputs.version >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: hrapp-chart-canary
      namespace: << inputs.provider.namespace >>
    spec:
      interval: 1h
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      ref:
        semver: << inputs.canaryVersion >>
